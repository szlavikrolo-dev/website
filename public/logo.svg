<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <!-- Dark Metallic Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B101D"/>
      <stop offset="50%" stop-color="#121B2D"/>
      <stop offset="100%" stop-color="#080C16"/>
    </linearGradient>

    <!-- Steel Blue Metallic Gradient -->
    <linearGradient id="steelBlue" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="25%" stop-color="#60A5FA"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <!-- Light Steel Highlight Gradient for Slat Edge -->
    <linearGradient id="steelEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="40%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Chrome Silver Gradient for SZLÁVIK -->
    <linearGradient id="chromeSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)"/>
  
  <g transform="translate(400, 260)" text-anchor="middle">
    <!-- Top Line: SZLÁVIK -->
    <text x="0" y="-120" font-family="'Montserrat', 'Orbitron', 'Inter', sans-serif" font-weight="900" font-size="64" fill="url(#chromeSilver)" letter-spacing="12" filter="url(#glow)">
      SZLÁVIK
    </text>

    <!-- Main Line: ÁRNYTECH -->
    <text x="0" y="-35" font-family="'Montserrat', 'Orbitron', 'Inter', sans-serif" font-weight="900" font-size="82" fill="url(#steelBlue)" letter-spacing="8" filter="url(#glow)">
      ÁRNYTECH
    </text>

    <!-- Subtitle: PRÉMIUM ÁRNYÉKOLÁSTECHNIKA -->
    <text x="0" y="25" font-family="'Inter', sans-serif" font-weight="600" font-size="20" fill="#94A3B8" letter-spacing="14">
      PRÉMIUM ÁRNYÉKOLÁSTECHNIKA
    </text>
  </g>

  <!-- Shutter Icon Symbol (Centered Below Text) -->
  <g transform="translate(210, 310)" filter="url(#glow)">
    <!-- Slat 1 Top -->
    <path d="M 40 10 L 360 40 L 320 80 L 15 80 C 22 65, 22 55, 15 45 Z" fill="url(#steelBlue)" stroke="url(#steelEdge)" stroke-width="1.5"/>
    
    <!-- Slat 2 Middle -->
    <path d="M 15 90 L 340 55 L 295 125 L 15 125 Z" fill="url(#steelBlue)" opacity="0.9" stroke="url(#steelEdge)" stroke-width="1.5"/>

    <!-- Slat 3 Bottom with Frame Bracket -->
    <path d="M 15 135 L 310 70 L 260 170 L 45 170 L 45 200 L 15 175 Z" fill="url(#steelBlue)" opacity="0.8" stroke="url(#steelEdge)" stroke-width="1.5"/>
  </g>
</svg>
